#
# What the signer needs: read the requests, write their status, and sign for
# its own signer name. Nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-cert-signer
  namespace: cert-signer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-cert-signer
rules:
  - apiGroups: [certificates.k8s.io]
    resources: [podcertificaterequests]
    verbs: [get, list, watch]
  - apiGroups: [certificates.k8s.io]
    resources: [podcertificaterequests/status]
    verbs: [update]
  - apiGroups: [certificates.k8s.io]
    resources: [signers]
    resourceNames: [example.com/workload]
    verbs: [sign]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-cert-signer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-cert-signer
subjects:
  - kind: ServiceAccount
    name: pod-cert-signer
    namespace: cert-signer
