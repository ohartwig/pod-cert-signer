#
# Two replicas: a request is answered by exactly one of them, because the
# status write is conditional on the request's resourceVersion. The AWS
# variables are for IRSA; any credential the SDK's default chain finds works.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-cert-signer
  namespace: cert-signer
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: pod-cert-signer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pod-cert-signer }
    spec:
      serviceAccountName: pod-cert-signer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: signer
          image: ghcr.io/ohartwig/pod-cert-signer:0   # adjust to your registry and a pinned digest
          args: ["run"]
          ports:
            - { name: metrics, containerPort: 9090 }
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 15
          env:
            - { name: KMS_KEY_ID, value: alias/pod-cert-signer }
            - { name: AWS_REGION, value: eu-central-1 }
            - { name: AWS_ROLE_ARN, value: "arn:aws:iam::123456789012:role/pod-cert-signer" }
            - { name: AWS_WEB_IDENTITY_TOKEN_FILE, value: /run/aws/token }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/pod-cert-signer, readOnly: true }
            - { name: aws-token, mountPath: /run/aws, readOnly: true }
      volumes:
        - name: config
          configMap: { name: pod-cert-signer }
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pod-cert-signer
  namespace: cert-signer
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pod-cert-signer }
