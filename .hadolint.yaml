  # DL3037 wants every zypper package pinned to an exact version. The build
  # stage installs the CA trust store, ca-certificates and
  # ca-certificates-mozilla, and lets the current Tumbleweed decide their
  # version: an exact pin would mean shipping a stale trust store. Same
  # reasoning as DL3018 had for apk while the base was Wolfi.
