# The container image for a release: ghcr.io/ohartwig/pod-cert-signer,
# linux/amd64 and linux/arm64.
#
# THIS WORKFLOW DOES NOT BUILD THE SIGNER. It downloads the binaries of the
# release, checks them against SHA256SUMS, and copies one into an image. The
# release is cut, built and signed upstream; this packages what it published.
#
# Signing is keyless: the image signature is made against this workflow's
# OIDC identity, so anyone can verify it without a key from us --
#
#   cosign verify ghcr.io/ohartwig/pod-cert-signer:0.3.0 \
#     --certificate-identity-regexp '^https://github.com/ohartwig/pod-cert-signer/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# Actions are pinned to commit SHAs, the version behind each written beside
# it; the pins are the same as pinup's and are reviewed by hand.
name: images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, e.g. v0.3.0"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/pod-cert-signer
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing
    steps:
      - name: The tag being packaged
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$RELEASE_TAG}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH tag"; exit 1 ;;
          esac
          version="${tag#v}"
          major="${version%%.*}"
          minor="${version%.*}"
          # A rolling tag moves only to the newest release it names, so
          # packaging an older release by hand never turns one back.
          releases="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 500 \
            --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V)"
          newest_in() { printf '%s\n' "$releases" | grep -E "^${1//./\\.}\." | tail -1; }
          rolling=""
          if [ "$version" = "$(newest_in "$minor")" ]; then rolling="$rolling $minor"; fi
          if [ "$version" = "$(newest_in "$major")" ]; then rolling="$rolling $major"; fi
          if [ "$version" = "$(printf '%s\n' "$releases" | tail -1)" ]; then rolling="$rolling latest"; fi
          echo "rolling tags for $version:${rolling:- none, a newer release carries them}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "tags<<TAGS_EOF"
            echo "$IMAGE:$version"
            for r in $rolling; do echo "$IMAGE:$r"; done
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      # The release is published before its files are uploaded, and
      # `published` starts this run within a second - so the files are waited
      # for. `sha256sum -c` is the gate: a download that does not match what
      # the release published stops the build before anything is pushed.
      - name: Fetch and verify the released binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          want="SHA256SUMS pod-cert-signer-linux-amd64 pod-cert-signer-linux-arm64"
          missing=""
          for _ in $(seq 60); do
            have=" $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '[.assets[] | select(.state == "uploaded") | .name] | join(" ")') "
            missing=""
            for f in $want; do
              case "$have" in *" $f "*) ;; *) missing="$missing $f" ;; esac
            done
            [ -z "$missing" ] && break
            echo "waiting for the release's assets:$missing"
            sleep 10
          done
          [ -z "$missing" ] || { echo "::error::after ten minutes the release still lacks:$missing"; exit 1; }
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'pod-cert-signer-linux-*' --pattern 'SHA256SUMS'
          for f in $want; do
            test -s "dist/$f" || { echo "::error::the release carries no $f"; exit 1; }
          done
          ( cd dist && sha256sum -c --ignore-missing SHA256SUMS )

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: packaging/Containerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.title=pod-cert-signer
            org.opencontainers.image.description=A signer for Kubernetes pod certificates, with its CA key in AWS KMS
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Scan BEFORE signing, and fail on what can be fixed.
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # By digest, not by tag: a signature over a tag says nothing about the
      # bytes anyone pulls tomorrow.
      - name: Sign
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: What was published
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          {
            echo "### Image for ${VERSION}"
            echo
            echo '```'
            echo "$REF"
            echo '```'
            echo
            echo "Signed keyless; verify with"
            echo
            echo '```'
            echo "cosign verify $REF \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
