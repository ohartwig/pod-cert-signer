# SPDX-FileCopyrightText: 2026 Kai Ole Hartwig <mail@ole-hartwig.eu>
# SPDX-License-Identifier: Apache-2.0
#
# The release follows yasrt/cli, the shape the yasrt component recommends: the
# binaries are built, signed and uploaded on the main pipeline BEFORE the tag
# is cut, so a tag always names an artefact that exists (GDG-44 is what the
# other order costs). devops/images/pod-cert-signer fetches them from the
# package registry by version.
#
# `stages:` is declared, and it REPLACES the composed list: this is a superset
# of what the go template uses plus version/build/release. A job in a stage
# missing here produces zero jobs and no error.
stages: [quick, test, version, build, release, sign]

variables:
  GO_IMAGE: registry.ole-hartwig.eu/devops/images/golang:1.27@sha256:9940fe57fea2f02ccd865e5cd584749a9b5726a717b364b4bdf39e4045b49b76
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOPATH: ${CI_PROJECT_DIR}/.go

include:
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/composed-default-pipelines/go@2
    inputs:
      # Pilot der blockierenden KI-Review, 2026-09-27 bis 2026-10-11 (Pilot-Issue
      # in devops/ci-cd-components/ai-tools): ein Veto macht ai:review bei
      # Nicht-pinup-MRs rot, und mit "Pipelines muessen erfolgreich sein" wartet
      # der Merge, bis der Befund behoben oder mit dem Label
      # `ai-review::dismissed` plus Job-Wiederholung aufgehoben ist.
      # Rueckweg: diese Zeile loeschen.
      ai-review-blocking: 'true'
      working-directory: '.'
      go-image: registry.ole-hartwig.eu/devops/images/golang:1.27@sha256:9940fe57fea2f02ccd865e5cd584749a9b5726a717b364b4bdf39e4045b49b76
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/release-tools/yasrt@2
    inputs:
      stage-version: version
      stage-release: release
      product: custom
      tag-format: 'v${version}'
      # product: custom derives no non-release paths, and yasrt refuses to
      # decide without them (first main pipeline, 2026-09-25). Changes to
      # these alone cut no release.
      non-release-paths: ['README.md', '.gitlab/**', '.gitsigners', '.gitsigners.d/**', 'LICENSES/**', '.markdownlint.jsonc']
      mr-comments: 'true'
      # The fast lane: after a release, pinup/runner bumps the consumers
      # (devops/images/pod-cert-signer, whose own release then reaches
      # koh-gitops) within minutes instead of at the four-hourly scan.
      # release:trigger-pinup waits for `release`, and `release` needs
      # upload:package-registry below - so the lane starts only once the
      # binaries it will look up are published. tools/fastlane checks both.
      trigger-pinup: 'true'
  # A detached cosign signature over SHA256SUMS, KMS key via the CI signing
  # role (its trust covers devops/* on main).
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/build-provenance/sign-artifact@2.0.192
    inputs:
      stage: build
      artifact-file: dist/SHA256SUMS
      needs-config:
        - version
        - build:binaries
      rules-config:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      additional-script-begin: '[ "$RELEASE_STATUS" = "release" ] || { echo "skip: ${RELEASE_STATUS:-unknown}"; exit 0; }'
  # Not part of the go composed pipeline. .gitsigners and SPDX headers without
  # the jobs that read them are decoration, not gates.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/lint-tools/commit-signing-verify@1.38.26
    inputs:
      stage: quick
  # The licence gate, live since lint-tools 1.36.45: a multi-arch reuse image
  # and no PHP-only rule (GDG-50). allow_failure is taken back below.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/lint-tools/lint-reuse@1.38.26
    inputs:
      stage: quick
      rules-config:
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - when: never

  # The public mirror at github.com/ohartwig/pod-cert-signer, the same
  # component as yasrt, pinup and s3mail: main and the v-tags, with the
  # history rewritten without the paths that are working material of this
  # instance. Runs last, so a tag cut in this pipeline goes out with it.
  #
  # GITHUB_MIRROR_TOKEN is a fine-grained token with contents:write on the
  # mirror repository. Without it neither job exists.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/extension-clean-export/github-mirror@1
    inputs:
      stage: .post
      mirror-target: 'ohartwig/pod-cert-signer'
      mirror-token-var: 'GITHUB_MIRROR_TOKEN'
      strip-paths: ['CLAUDE.md', '.gitsigners', '.gitsigners.d', '.gitlab', 'renovate.json', '.mise.toml', 'lefthook.yml']
      keep-tags: 'v*'
      prune: 'true'
      rules-config:
        - if: $GITHUB_MIRROR_TOKEN == null
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

  # The GitHub release, with the binaries this pipeline built and the
  # manifest it signed - the files the package registry holds, not a second
  # build. Its `published` event starts .github/workflows/images.yml, which
  # packages those binaries as ghcr.io/ohartwig/pod-cert-signer.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/extension-clean-export/github-release@1
    inputs:
      stage: .post
      release-target: 'ohartwig/pod-cert-signer'
      release-token-var: 'GITHUB_MIRROR_TOKEN'
      release-tag: 'v${RELEASE_VERSION}'
      assets: ['dist/pod-cert-signer-*', 'dist/SHA256SUMS', 'dist/SHA256SUMS.sig']
      notes-from-report: 'release-report.json'
      needs-config:
        - mirror:github
        - version
        - build:binaries
        - release
        - job: sign:artifact:dist/SHA256SUMS
          optional: true
      rules-config:
        - if: $GITHUB_MIRROR_TOKEN == null
          when: never
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      additional-script-begin: '[ "$RELEASE_STATUS" = "release" ] || { echo "skip: ${RELEASE_STATUS:-unknown}"; exit 0; }'

lint:reuse:
  allow_failure: false

# Extended, not replaced. The count assertion is the point: a suite that runs
# zero tests and a suite that does not run are both green otherwise.
test:go:
  script:
    - go test -race -coverprofile=coverage.out ./...
    - |
      set -eu
      pkgs="$(go list ./... | wc -l | tr -d ' ')"
      echo "packages: $pkgs"
      test "$pkgs" -gt 0 || { echo "no packages - the suite did not run"; exit 1; }
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

# The design's four checks, each with its rule removed on purpose: every
# mutant must compile and turn its test red (tools/mutation). A surviving
# mutant fails this job; that is how we know the checks can fail.
test:mutation:
  stage: test
  image: ${GO_IMAGE}
  needs: [test:go]
  script:
    - go run ./tools/mutation

# GitLab evaluates rules: before .release.env exists, so the release status is
# checked in each script.
.needs-release: &needs-release
  - '[ "$RELEASE_STATUS" = "release" ] || { echo "skip: ${RELEASE_STATUS:-unknown}"; exit 0; }'

build:binaries:
  stage: build
  image: ${GO_IMAGE}
  needs: [version, test:go]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - *needs-release
    - mkdir -p dist
    - |
      for arch in amd64 arm64; do
        CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
          go build -trimpath -ldflags "-s -w" \
          -o "dist/pod-cert-signer-linux-$arch" ./cmd/pod-cert-signer
      done
    - cd dist && sha256sum pod-cert-signer-* > SHA256SUMS && cat SHA256SUMS
  artifacts:
    paths: [dist/]
    expire_in: 1 day

upload:package-registry:
  stage: build
  needs:
    - version
    - build:binaries
    - job: sign:artifact:dist/SHA256SUMS
      optional: true
  image: registry.ole-hartwig.eu/devops/images/curl:8.21@sha256:4ac7ea4bb4cfe0c689890e7fadaf2e85eb12f076f418de8512f1fbc7b9c88984
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pod-cert-signer"
  script:
    - *needs-release
    - cd dist
    # An unsigned manifest is not a release.
    - test -s SHA256SUMS.sig || { echo "SHA256SUMS.sig missing; refusing to publish unsigned"; exit 1; }
    - |
      for f in pod-cert-signer-linux-amd64 pod-cert-signer-linux-arm64 SHA256SUMS SHA256SUMS.sig; do
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PACKAGE_URL}/${RELEASE_VERSION}/${f}"
      done

release:
  needs: [version, build:binaries, upload:package-registry]
