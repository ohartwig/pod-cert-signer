# SPDX-License-Identifier: Apache-2.0
#
# The release follows yasrt/cli, the shape the yasrt component recommends: the
# binaries are built, signed and uploaded on the main pipeline BEFORE the tag
# is cut, so a tag always names an artefact that exists (GDG-44 is what the
# other order costs). devops/images/pod-cert-signer fetches them from the
# package registry by version.
#
# `stages:` is declared, and it REPLACES the composed list: this is a superset
# of what the go template uses plus version/build/release. A job in a stage
# missing here produces zero jobs and no error.
stages: [quick, test, version, build, release, sign]

variables:
  GO_IMAGE: registry.ole-hartwig.eu/devops/images/golang:1.27@sha256:9940fe57fea2f02ccd865e5cd584749a9b5726a717b364b4bdf39e4045b49b76
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOPATH: ${CI_PROJECT_DIR}/.go

include:
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/composed-default-pipelines/go@2
    inputs:
      working-directory: '.'
      go-image: registry.ole-hartwig.eu/devops/images/golang:1.27@sha256:9940fe57fea2f02ccd865e5cd584749a9b5726a717b364b4bdf39e4045b49b76
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/release-tools/yasrt@2
    inputs:
      stage-version: version
      stage-release: release
      product: custom
      tag-format: 'v${version}'
      mr-comments: 'true'
  # A detached cosign signature over SHA256SUMS, KMS key via the CI signing
  # role (its trust covers devops/* on main).
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/build-provenance/sign-artifact@2
    inputs:
      stage: build
      artifact-file: dist/SHA256SUMS
      needs-config:
        - version
        - build:binaries
      rules-config:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      additional-script-begin: '[ "$RELEASE_STATUS" = "release" ] || { echo "skip: ${RELEASE_STATUS:-unknown}"; exit 0; }'
  # Not part of the go composed pipeline. .gitsigners and SPDX headers without
  # the jobs that read them are decoration, not gates.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/lint-tools/commit-signing-verify@1
    inputs:
      stage: quick
  # lint-reuse is NOT included, deliberately. Its default rule creates the
  # job only when **/*.php exists (a Go repository gets no job and no error),
  # and its image is amd64-only while every docker runner here is arm64
  # (exec format error, measured 2026-09-25). It comes back with a multi-arch
  # reuse image; until then `reuse lint` is a local check (README).

# Extended, not replaced. The count assertion is the point: a suite that runs
# zero tests and a suite that does not run are both green otherwise.
test:go:
  script:
    - go test -race -coverprofile=coverage.out ./...
    - |
      set -eu
      pkgs="$(go list ./... | wc -l | tr -d ' ')"
      echo "packages: $pkgs"
      test "$pkgs" -gt 0 || { echo "no packages - the suite did not run"; exit 1; }
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'

# The design's four checks, each with its rule removed on purpose: every
# mutant must compile and turn its test red (tools/mutation). A surviving
# mutant fails this job; that is how we know the checks can fail.
test:mutation:
  stage: test
  image: ${GO_IMAGE}
  needs: [test:go]
  script:
    - go run ./tools/mutation

# GitLab evaluates rules: before .release.env exists, so the release status is
# checked in each script.
.needs-release: &needs-release
  - '[ "$RELEASE_STATUS" = "release" ] || { echo "skip: ${RELEASE_STATUS:-unknown}"; exit 0; }'

build:binaries:
  stage: build
  image: ${GO_IMAGE}
  needs: [version, test:go]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  script:
    - *needs-release
    - mkdir -p dist
    - |
      for arch in amd64 arm64; do
        CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
          go build -trimpath -ldflags "-s -w" \
          -o "dist/pod-cert-signer-linux-$arch" ./cmd/pod-cert-signer
      done
    - cd dist && sha256sum pod-cert-signer-* > SHA256SUMS && cat SHA256SUMS
  artifacts:
    paths: [dist/]
    expire_in: 1 day

upload:package-registry:
  stage: build
  needs:
    - version
    - build:binaries
    - job: sign:artifact:dist/SHA256SUMS
      optional: true
  image: registry.ole-hartwig.eu/devops/images/curl:8.21@sha256:77fa0f7d62321743ca0f8fac03860b3d469dc9390cda007bc2a3af41a82f140a
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pod-cert-signer"
  script:
    - *needs-release
    - cd dist
    # An unsigned manifest is not a release.
    - test -s SHA256SUMS.sig || { echo "SHA256SUMS.sig missing; refusing to publish unsigned"; exit 1; }
    - |
      for f in pod-cert-signer-linux-amd64 pod-cert-signer-linux-arm64 SHA256SUMS SHA256SUMS.sig; do
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PACKAGE_URL}/${RELEASE_VERSION}/${f}"
      done

release:
  needs: [version, build:binaries, upload:package-registry]
